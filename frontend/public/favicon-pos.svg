<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="posGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="posAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="bgGradPOS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="posGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradPOS)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#posGreen)" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Terminal Display Base Screen -->
  <rect x="12" y="12" width="40" height="28" rx="5" fill="#022c22" stroke="url(#posGreen)" stroke-width="1.8" filter="url(#posGlow)" />
  
  <!-- Terminal Screen Content: Velora Monogram "V" in screen -->
  <path d="M23 18 L29 33 C29.8 35 34.2 35 35 33 L41 18" stroke="url(#posAmber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminal Stand & Keyboard Base -->
  <path d="M26 40 L24 48 L40 48 L38 40 Z" fill="#0f172a" stroke="url(#posGreen)" stroke-width="1.2" />
  <rect x="18" y="48" width="28" height="4" rx="2" fill="url(#posGreen)" />

  <!-- Active POS Status Indicator LED -->
  <circle cx="47" cy="17" r="2" fill="#34d399" />
</svg>
