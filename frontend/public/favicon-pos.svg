<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- ORDELL Vibrant Amber/Orange Gradient -->
    <linearGradient id="posOrdellOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- ORDELL Vibrant Electric Blue Gradient -->
    <linearGradient id="posOrdellBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#0070F3" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>

    <linearGradient id="bgGradPOS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <filter id="posGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0070F3" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF6D00" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradPOS)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#posOrdellOrange)" stroke-width="1.2" stroke-opacity="0.45" fill="none" />

  <!-- Terminal Display Base Screen -->
  <rect x="12" y="11" width="40" height="29" rx="5" fill="#0A1120" stroke="url(#posOrdellBlue)" stroke-width="1.8" filter="url(#posGlow)" />
  
  <!-- Terminal Screen Content: ORDELL Ribbon "O" monogram in screen -->
  <path
    d="M32 16 C37 16, 41 20, 41 25.5 C41 31, 37 35, 32 35.5 C29.5 35.5, 28 33.5, 28 31 C28 27.5, 33 25, 36 23 C37 22, 38 21, 38 19.5 C38 17, 35 16, 32 16 Z"
    fill="url(#posOrdellBlue)"
  />
  <path
    d="M32 16 C27 16, 23 20, 23 25.5 C23 31, 27 35, 32 35.5 C30 34.5, 29 32.5, 29 30 C28 27, 31 24, 34 22 C35.5 21, 36.5 19.5, 36.5 18 C36.5 16.5, 35 16, 32 16 Z"
    fill="url(#posOrdellOrange)"
  />
  
  <!-- Terminal Stand & Keyboard Base -->
  <path d="M26 40 L24 48 L40 48 L38 40 Z" fill="#0F172A" stroke="url(#posOrdellOrange)" stroke-width="1.2" />
  <rect x="18" y="48" width="28" height="4" rx="2" fill="url(#posOrdellOrange)" />

  <!-- Active POS Status Indicator LED -->
  <circle cx="47" cy="16" r="2" fill="#00E5FF" />
</svg>
