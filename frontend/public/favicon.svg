<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- ORDELL Vibrant Amber/Orange Gradient -->
    <linearGradient id="ordellOrange" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="45%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- ORDELL Vibrant Electric Blue Gradient -->
    <linearGradient id="ordellBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="40%" stop-color="#0070F3" />
      <stop offset="85%" stop-color="#0038A8" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>

    <!-- Premium Dark Background -->
    <linearGradient id="ordellBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="ordellGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF6D00" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0070F3" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="64" height="64" rx="16" fill="url(#ordellBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#ordellOrange)" stroke-width="1.2" stroke-opacity="0.4" fill="none" />

  <!-- ORDELL Ribbon "O" Symbol -->
  <g filter="url(#ordellGlow)">
    <!-- Right / Back Blue Loop Ribbon -->
    <path
      d="M32 11 C42 11, 49 19, 49 32 C49 43, 42 51, 32 53 C26 53, 23 49, 23 45 C23 37, 34 32, 40 28 C43 26, 44 23, 44 20 C44 14, 39 12, 32 12 C28.5 12, 26 13.5, 24 15.5 L28 11.5 C29.5 11.2, 30.7 11, 32 11 Z"
      fill="url(#ordellBlue)"
    />

    <!-- Left / Front Orange Loop Ribbon -->
    <path
      d="M32 11 C23 11, 16 19, 16 32 C16 43, 23 52, 33 53 C30 51, 28 47.5, 27 43 C25.5 37, 26 31, 31 27 C36 23, 39 20, 39 16 C39 13.5, 36.5 11, 32 11 Z"
      fill="url(#ordellOrange)"
    />

    <!-- Inner Core Dynamic Flow Ribbon Curve -->
    <path
      d="M20 28 C23 27, 27 29, 31 34 C35 39, 39 43, 45 42 C41 47, 35 49, 30 48 C24 47, 20 40, 20 28 Z"
      fill="url(#ordellBlue)"
      opacity="0.95"
    />

    <!-- Signature Orange Accent Notch / Highlight on 'O' -->
    <path
      d="M17 29 C18 26, 22 23, 26 21 C24 23, 22 26, 21 29 C20 31, 18 32, 17 29 Z"
      fill="#FFD54F"
      opacity="0.9"
    />
  </g>
</svg>
